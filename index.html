<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pink Dots Pattern</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Baloo+2">
  <link rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Quicksand">
</head>
<body>

    <main>

        <section id="hero">

            <div class="left">

                <h1>HIKARU<br>IWASHITA</h1>

                <div class="buttons">
                    <button id="start" onclick="location.href='#about-me'">
                        Start ▼
                    </button>
                    <button id="saved-slots">
                        Saved slots
                    </button>
                </div>

            </div>

            <div class="right">

                <div class="card-3d">
                    <img src="assets/full-reaction.png" alt="mii" class="reaction">
                    <img src="assets/glasses.png" alt="mii" class="reaction">
                    <img src="assets/sad-not-so-sad.png" alt="mii" class="reaction">
                    <img src="assets/waving.png" alt="mii" class="reaction">
                </div>
                <div class="shadow"></div>

            </div>

        </section>

        <section id="about-me">



        </section>

    </main>

    <div class="popup-overlay">
        <div class="popup">
            <div class="top">
                <h2>Saved memories</h2>
                <h1>x</h1>
            </div>
            <div class="carousel">
                <img src="assets/childhood.png" alt="kid-me" class="memory">
                <video src="assets/graduation.mp4" alt="graduation" autoplay muted loop preload="metadata" playsinline  class="memory"></video>
                <img src="assets/japan.png" alt="japan" class="memory">
                <video src="assets/expo.mp4" alt="expotech" autoplay muted loop preload="metadata" playsinline class="memory"></video>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
